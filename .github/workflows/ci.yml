name: ERM Copilot Automated CI/CD Test Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Nightly run at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  python-test-suite:
    name: Python Test Matrix (Unit, API, Agents, RAG, Security, Integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Unit Tests
        run: python -m pytest tests/unit/ -m unit -v

      - name: Run API Tests
        run: python -m pytest tests/api/ -m api -v

      - name: Run Agent & Orchestrator Tests
        run: python -m pytest tests/agents/ -m agent -v

      - name: Run RAG & Agentic RAG Tests
        run: python -m pytest tests/rag/ -m rag -v

      - name: Run Security & RBAC Tests
        run: python -m pytest tests/security/ -m security -v

      - name: Run Integration Tests
        run: python -m pytest tests/integration/ -m integration -v

      - name: Run Complete Test Suite with Coverage
        run: |
          python -m pytest tests/ ERM_Copilot/tests/ --cov=ERM_Copilot --cov-report=xml --cov-report=term-missing

  playwright-e2e-suite:
    name: Playwright Browser E2E Tests
    runs-on: ubuntu-latest
    needs: python-test-suite
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Dependencies
        run: |
          cd tests/e2e/playwright
          npm install
          npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: |
          cd tests/e2e/playwright
          npx playwright test
        env:
          BASE_URL: "http://localhost:5000"

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/
          retention-days: 14
