[pytest]
testpaths = tests ERM_Copilot/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

markers =
    unit: Unit tests verifying isolated functions, calculations, and services.
    api: API endpoint tests for FastAPI and Flask controllers.
    agent: AI Agent orchestrator, subagent, and tool selection tests.
    rag: RAG and Agentic RAG retrieval, ranking, and grounding tests.
    security: RBAC, authentication, authorization, and prompt injection tests.
    integration: End-to-end cross-service workflows and database transactions.
    e2e: End-to-end browser and scenario journeys.
    evaluation: AI behavioral, multi-turn, RBAC matrix, and hallucination evaluation tests.
addopts = -v --tb=short --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
