{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='cdn/datatables.min.css') }}">

        <!-- Title Icon Start -->

        <!--begin::App Content-->
        <div class="app-content">
          <!--begin::Container-->
          <div class="container-fluid">

          

<div class="bd-example m-0 border-0 tab-content active table-responsive"> 
<table id="departmentstbl" class="table table-hover table-bordered" style="width: 100%;">
  <thead>
    <tr class="tb-head">
      <th scope="col">Function Name</th>
      <th scope="col">Short Code</th>
      <th scope="col">Description</th>
      <th scope="col" width="60">Action</th>
    </tr>
    </tr>
  </thead>

<tbody>
</tbody>
</table> 

</div>  
  <!-- Start PopUp -->
   <!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="staticBackdropLabel">Add/Edit Function</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
       <div class="row">

      <div class="col-lg-6">
    <div class="row mb-3">
  <label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Function Name <span class="star">*</span></label>
  <div class="col-sm-8">
    <input type="text" class="form-control form-control-sm" id="departmentName" placeholder="Department Name">
  </div>
  </div>
      </div>

      <div class="col-lg-6">
    <div class="row mb-3">
  <label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Short Code <span class="star">*</span></label>
  <div class="col-sm-8">
    <input type="text" class="form-control form-control-sm" id="shortCode" placeholder="Short Code" maxlength="10" pattern="\d{10}">
  </div>
  </div>
      </div>

      <div class="col-lg-12">
    <div class="row mb-3">
  <label for="colFormLabelSm" class="col-sm-2 col-form-label col-form-label-sm">Description</label>
  <div class="col-sm-10">
  <textarea class="form-control form-control-sm" rows="3" id="Description" placeholder="Description"></textarea>
  </div>
  </div>
      </div>


      </div>

      </div>

      <div class="modal-footer">
        
          <button type="button" class="btn btn-primary text-white" onclick="saveDepartment()">Save</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

</div>
          <!--end::Container-->
<!-- Toast -->
<div class="toast position-fixed top-0 end-0 p-3 mt-5" id="toastMsg" style="z-index:9999!important;">
<div class="toast-body bg-success text-white"></div>
        </div>

        </div>   
        <!--end::App Content-->
        
<script src="{{ url_for('static', filename='cdn/jquery-3.6.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='cdn/axios.min.js') }}"></script>
<script>
let table;
let selectedRow = null;
let selectedId = null;

$(document).ready(function(){
  loadDepartment();
});

async function loadDepartment() {
  try {
    const response = await axios.get('/get_Department_all');
    console.log("response get_Department_all", response);

    if (response.data.Error.Error === false) {
      var data = response.data.data;

      $('#departmentstbl').DataTable({
        destroy: true,
        data: data,
        columns: [
          { data: "dept_name" },
          { data: "dept_short_name" },
          { data: "description" },
         //{
         //  data: "id",
         //  render: function (data) {
         //    return `
         //      <a href="#"><i class="bi bi-pencil-square edit-icon-color"
         //      data-bs-toggle="modal" title="Edit"
         //      onclick="editDepartment(${data})"></i></a>
         //      |
         //      <a href="#"><i class="bi bi-trash delete-icon-color"
         //      data-bs-toggle="tooltip" title="History" onclick="deleteDepartment(${data})"></i></a>
         //    `;
         //  }
         //} 

         {
            data: "id",
            render: function (data) {
              return `
                <a href="#"><i class="bi bi-pencil-square edit-icon-color"
                data-bs-toggle="modal" title="Edit"
                onclick="editDepartment(${data})"></i></a>
                
              `;
            }
          }
        ]
      });

    } else {
      showToast(response.data.Error.Error_message);
    }

  } catch (error) {
    showToast("Failed to load categories");
  }
}

function validate(){
  if(!departmentName.value || !shortCode.value){
    showToast("Fill required fields","bg-danger");
    return false;
  }

  if(shortCode.value.length > 10){
    showToast("Short code must be maximum 10 characters","bg-danger");
    return false;
  }

  return true;
}

async function saveDepartment(){
  if(!validate()) return;

  const data = {
    dept_name:departmentName.value,
    dept_short_name:shortCode.value,
    description:Description.value,
  };

  if(selectedId){
    await axios.put(`/department/update/${selectedId}`,data);
    showToast("Department updated successfully");
    
    clearall();
    
  } else {
    await axios.post('/department/create',data)
    
    //showToast("Department created successfully");
    //clearall();
    .then(response => {
        if (response.data.Error.Error === false) 
        {
            var data = response.data.data;
            showToast("Department created successfully");
            clearall();
          }
          else {
            //showToast(response.data.Error.Error_message);
             showToast("Failed to create Department", "bg-danger");
          }
    })
  }
  loadDepartment();

  bootstrap.Modal.getInstance(staticBackdrop).hide();
  //loadDepartment();
}

async function editDepartment(id){
  //alert("editt callhhh")
  
  const res = await axios.get(`/department/${id}`);
  const u = res.data.data;

  selectedId = u.id;
  departmentName.value=u.dept_name;
  shortCode.value=u.dept_short_name;
  Description.value=u.description;

  new bootstrap.Modal(staticBackdrop).show();
}

function showToast(msg,cls="bg-success"){
  let toastEl=document.getElementById('toastMsg');
  toastEl.querySelector('.toast-body').innerText=msg;
  toastEl.querySelector('.toast-body').className="toast-body text-white "+cls;
  new bootstrap.Toast(toastEl).show();
}

async function deleteDepartment(id){
  if(!confirm("Are you sure you want to delete this department?")){
    return;
  }

  await axios.delete(`/department/delete/${id}`);
  //showToast("Deleted");
  showToast("Department deleted successfully");
  loadDepartment();
}

function clearall()
{
   departmentName.value="";
   shortCode.value="";
   Description.value="";
   selectedId = null;
}
</script>
    
{% endblock %}
