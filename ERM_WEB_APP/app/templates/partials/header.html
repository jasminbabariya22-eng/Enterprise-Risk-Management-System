    try {
        const res = await axios.get(`/usersrole/${id}`);

        console.log("Role Data:", u);

    } catch (error) {
        console.error(error);
    }

function setSelectedMenus_Header(menuIds) {
console.log("Applying Menus:", menuIds);
    // HIDE ALL MENUS
    document.querySelectorAll('[data-id]').forEach(el => {
        el.style.display = 'none';
    });

    // SHOW ALLOWED MENUS
    menuIds.forEach(id => {
        let el = document.querySelector(`[data-id="${id}"]`);
        if (el) {
            el.style.display = '';
        }
    });

    // HIDE PARENT DROPDOWN IF NO CHILD VISIBLE
    document.querySelectorAll('.nav-item.dropdown').forEach(drop => {
        const visibleChild =
            drop.querySelector('.dropdown-item[style=""]');
        if (!visibleChild) {
            drop.style.display = 'none';
        } else {
            drop.style.display = '';
        }
    });
}
