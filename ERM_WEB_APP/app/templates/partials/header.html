<script src="{{ url_for('static', filename='cdn/axios.min.js') }}"></script>
<script>
  const APP_DATA = {{ session_data | tojson }};
</script>
<script>
  let USER_MENU_IDS = [];
  document.addEventListener("DOMContentLoaded", async function () {
    if (typeof APP_DATA !== "undefined" && APP_DATA) {
      const el = document.getElementById("card_user");
      const el_role = document.getElementById("card_role");
      const topName = document.getElementById("top_user_display_name");
      const el_on2 = document.getElementById("card_on2");

      const fullName = (APP_DATA.fname ? (APP_DATA.fname + " " + (APP_DATA.lname || "")) : (APP_DATA.userType || "ERM Admin"));
      if (topName) topName.innerText = fullName;
      if (el) el.innerText = fullName;
      if (el_role) el_role.innerText = APP_DATA.userType || APP_DATA.role_name || "Enterprise User";
      if (el_on2 && APP_DATA.financial_year) el_on2.innerText = APP_DATA.financial_year;
    }
    if (typeof APP_DATA !== "undefined" && APP_DATA.menuIds) {
      setSelectedMenus_Header(APP_DATA.menuIds);
    }
  });

  function setSelectedMenus_Header(menuIds) {
    if (!menuIds || !Array.isArray(menuIds)) return;
    document.querySelectorAll('[data-id]').forEach(el => {
      el.style.display = 'none';
    });
    menuIds.forEach(id => {
      let el = document.querySelector(`[data-id="${id}"]`);
      if (el) el.style.display = '';
    });
    document.querySelectorAll('.nav-item.dropdown').forEach(drop => {
      const visibleChild = drop.querySelector('.dropdown-item:not([style*="display: none"])');
      if (!visibleChild) {
        drop.style.display = 'none';
      } else {
        drop.style.display = '';
      }
    });
  }
</script>
