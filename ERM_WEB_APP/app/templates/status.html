<script src="{{ url_for('static', filename='cdn/jquery-3.6.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='cdn/axios.min.js') }}"></script>
        
<script>
let table;
let selectedRow = null;
let selectedId = null;

$(document).ready(function(){
 
  loadstatus();
});

async function loadstatus() {
  try {
   // alert("get_status_all");
    const response = await axios.get('/get_status_all');
    console.log("response get_status_all", response);

    if (response.data.Error.Error === false) {
      var data = response.data.data;
      $('#Statustbl').DataTable({
        destroy: true,
        data: data,
        columns: [
          { data: "status_name" },
          //{ data: "type" },
          {
            data: "type",
            render: function (data) {
              if (!data) return "";
              return data.replaceAll("_", " ")
                         .replace(/\b\w/g, c => c.toUpperCase());
            }
          },
         
          {
            data: "id",
            render: function (data) {
              return `
                <a href="#"><i class="bi bi-pencil-square edit-icon-color"
                data-bs-toggle="modal" title="Edit" 
                onclick="editStatus(${data})"></i></a>
                |
                <a href="#"><i class="bi bi-trash delete-icon-color"
                data-bs-toggle="tooltip" title="History" onclick="deletestatus(${data})"></i></a>
              `;
            }
          }
        ]
      });

      //$('#DescTable tbody tr:first').addClass('selected');

    } else {
      showToast(response.data.Error.Error_message);
    }

  } catch (error) {
    showToast("Failed to load categories");
  }
}

function validate(){
  if(!Status.value || !Type.value){
    showToast("Fill required fields","bg-danger");
    return false;
  }
  return true;
}

async function savestatus(){
  if(!validate()) return;

  const data = {
    status_name:Status.value,
    type:Type.value,
   
  };

  if(selectedId){
    await axios.put(`/Status/update/${selectedId}`,data);
    
    showToast("Status updated successfully");
    clearall();
    
  } else {
    await axios.post('/Status/create',data)
    
    //showToast("Status created successfully")
    //clearall();
    .then(response => {
        if (response.data.Error.Error === false) 
        {
            var data = response.data.data;
            showToast("Status created successfully");
            clearall();
          }
          else {
            //showToast(response.data.Error.Error_message);
             showToast("Failed to create Status", "bg-danger");
          }
    })
  }
  loadstatus();
  bootstrap.Modal.getInstance(staticBackdrop).hide();
  
}

async function editStatus(id){
 
  const res = await axios.get(`/Status/${id}`);
  const u = res.data.data;
console.log("Data Get  editusersrole:", u);
  selectedId = u.id;
  Status.value=u.status_name;
  Type.value=u.type;
  
  new bootstrap.Modal(staticBackdrop).show();
}

function showToast(msg,cls="bg-success"){
  let toastEl=document.getElementById('toastMsg');
  toastEl.querySelector('.toast-body').innerText=msg;
  toastEl.querySelector('.toast-body').className="toast-body text-white "+cls;
  new bootstrap.Toast(toastEl).show();
}

async function deletestatus(id){
  if(!confirm("Are you sure you want to delete this status?")){
    return;
  }
  await axios.delete(`/ststus/delete/${id}`);
  
  loadstatus();
  showToast("Status deleted successfully");
  
}

function clearall()
{
   Status.value=""
   selectedId = null;
   
}
</script>
