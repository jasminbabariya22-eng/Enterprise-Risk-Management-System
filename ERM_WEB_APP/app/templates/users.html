{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='cdn/datatables.min.css') }}">

<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">

        <span style="float:left; margin-right:20px">Users</span>

         <span>
            <a class="pl-5 navigate plus-icon-color" href="" data-bs-toggle="modal" data-bs-target="#staticBackdrop" onclick="clearall()"><i class="bi bi-plus-lg" data-bs-toggle="tooltip" data-bs-placement="top" title="Add"></i></a>
            <a class="pl-5 edit-icon-color disabled" href="#"><i class="bi bi-pencil-square" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit"></i></a>
            <a class="pl-5 delete-icon-color disabled" href="#"><i class="bi bi-trash" data-bs-toggle="tooltip" data-bs-placement="top" title="Delete"></i></a>
            <a class="pl-5 export-icon-color" href="#" onclick="downloadExcel()"><i class="bi bi-file-earmark-fill" data-bs-toggle="tooltip" data-bs-placement="top" title="Export"></i></a>

        </span>

      </div>
    </div>
  </div>
</div>

<div class="app-content">
<div class="container-fluid">

<div class="table-responsive">
<table id="userTable" class="table table-striped table-hover table-bordered">
<thead>
<tr class="tb-head">
  <th>First Name</th>
  <th>Last Name</th>
  <th>Login ID</th>
  <th>Email</th>
  <th>Mobile</th>
  <th>Department</th>
  <th>User Role</th>
  <th>Address</th>
  <th>User Type</th>
  <th width="5%" scope="col">Action</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>
</div>

<!-- MODAL -->
<div class="modal fade" id="staticBackdrop">
<div class="modal-dialog modal-xl modal-dialog-centered">
<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Add/Edit User </h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<div class="row">

<input type="hidden" id="userId">


  
<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">First Name <span class="star">*</span></label>
<div class="col-sm-8"><input id="firstName" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Last Name <span class="star">*</span></label>
<div class="col-sm-8"><input id="lastName" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
 <label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Login ID <span class="star">*</span></label>
<div class="col-sm-8"><input id="loginId" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Password <span class="star">*</span></label>
<div class="col-sm-8"><input type="password" id="password" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Confirm Password <span class="star">*</span></label>
<div class="col-sm-8"><input type="password" id="confirm_pwd" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Email <span class="star">*</span></label>
<div class="col-sm-8"><input type="email" id="email" class="form-control form-control-sm"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Mobile No</label>
<div class="col-sm-8"><input type="number" id="mobile" class="form-control form-control-sm" oninput="limitMobile(this)"></div>
</div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Department <span class="star">*</span></label>
<div class="col-sm-8">
<select id="department" class="form-select form-select-sm">

</select>
</div></div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">User Type <span class="star">*</span></label>
<div class="col-sm-8">
<select id="userType" class="form-select form-select-sm">

</select>
</div></div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">User Role <span class="star">*</span></label>
<div class="col-sm-8">
<select id="userRole" class="form-select form-select-sm">

</select>
</div></div></div>

<div class="col-lg-6"><div class="row mb-3">
<label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Address</label>
<div class="col-sm-8">
<textarea id="address" class="form-control form-control-sm"></textarea>
</div></div></div>

    <div class="col-lg-6"><div class="row mb-3">
  <label for="colFormLabelSm" class="col-sm-4 col-form-label col-form-label-sm">Active</label>
  <div class="col-sm-8 label-text">
    <div class="form-check">
   <input class="form-check-input" type="checkbox" value="" id="defaultCheck1" style="border:1px solid #a1a4a6;">
</div>
</div></div></div>

</div>
</div>

<div class="modal-footer">
<button class="btn btn-primary" onclick="saveUser()">Save</button>
<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
</div>

</div>
</div>
</div>

<!-- Toast -->
<div class="toast position-fixed top-0 end-0 p-3 mt-5" id="toastMsg" style="z-index:9999!important;">
<div class="toast-body bg-success text-white"></div>
</div>

<script src="{{ url_for('static', filename='cdn/jquery-3.6.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='cdn/datatables.min.js') }}"></script>
<script src="{{ url_for('static', filename='cdn/axios.min.js') }}"></script>

<script>

let table;
let selectedRow = null;
let selectedId = null;

function limitMobile(el){
  if(el.value.length > 10){
    el.value = el.value.slice(0,10);
  }
}

$(document).ready(function(){
  table = $('#userTable').DataTable();
  FillDepartment();
  loadUsers();
  Filluser_types();
  Filluser_role();
  setStatus();
});

function FillDepartment() {
    axios.get("/getalldpt")
    .then(response => {

        if (response.data.Error.Error === false) {
            var data = response.data.data;
            var optionHTML = '';
            for (var i = 0; i < data.length; i++) {
                optionHTML += '<option value="' + data[i].id + '">' 
                          //  + data[i].dept_short_name +'-'
                            + data[i].dept_name + 
                            '</option>';
            }
            document.getElementById("department").innerHTML = optionHTML;
          
          } else {
            showToast(response.data.Error.Error_message);
        }

    })
    .catch(error => {
        showToast("Failed to load departments");
    });
}

function Filluser_types() {
    axios.get("/user_types")
    .then(response => {

        if (response.data.Error.Error === false) {
            var data = response.data.data;
            var optionHTML='';
            for (var i = 0; i < data.length; i++) {
                optionHTML += '<option value="' + data[i].id + '">' 
                            + data[i].name +
                            '</option>';
            }
            document.getElementById("userType").innerHTML = optionHTML;
           
          } else {
            showToast(response.data.Error.Error_message);
        }

    })
    .catch(error => {
        showToast("Failed to load departments");
    });
}

function Filluser_role() {
    axios.get("/user_role")
    .then(response => {

        if (response.data.Error.Error === false) {
            var data = response.data.data;
            var optionHTML='';
            for (var i = 0; i < data.length; i++) {
                optionHTML += '<option value="' + data[i].id + '">' 
                            + data[i].name +
                            '</option>';
            }
            document.getElementById("userRole").innerHTML = optionHTML;
           
          } else {
            showToast(response.data.Error.Error_message);
        }

    })
    .catch(error => {
        showToast("Failed to load departments");
    });
}


async function loadUsers(){
  const res = await axios.get('/get_users_all');
  table.clear();

  res.data.data.forEach(u=>{
  

   // let actionHtml = `
   //   <i class="bi bi-pencil-square  edit-icon-color edit-btn" data-id="${u.id}"></i>
   //   |
   //   <i class="bi bi-trash delete-icon-color delete-btn hidden" data-id="${u.id}"></i>
   // `;

   let actionHtml = `
  <i class="bi bi-pencil-square  edit-icon-color edit-btn" data-id="${u.id}"></i>
`;
    let rowNode = table.row.add([
      u.first_name, u.last_name, u.log_id,
      u.email, u.contact_no, u.department_name,
      u.role_name, u.user_type_name, u.user_type_name,
      actionHtml   
    ]).draw(false).node();

    $(rowNode).data("id", u.id);
  });
}



$('#userTable tbody').on('click', '.edit-btn', function () {
  let id = $(this).data('id');
 
  editUser(id);
});

$('#userTable tbody').on('click', '.delete-btn', function () {
  let id = $(this).data('id');
  
  deleteUser(id);
});

function openAddModal(){
  selectedId = null;
  document.getElementById("staticBackdrop").querySelectorAll("input,textarea").forEach(i=>i.value="");
}

async function editUser(id){
  
  
  const res = await axios.get(`/users/${id}`);
  const u = res.data.data;

  selectedId = id;

  firstName.value=u.first_name;
  lastName.value=u.last_name;
  loginId.value=u.log_id;
  password.value=u.password;
  confirm_pwd.value=u.password;
  email.value=u.email;
  department.value=u.department_id;
  userType.value=u.user_type_id;
  userRole.value=u.role_id;
  mobile.value=u.contact_no;
  address.value=u.address;
  $("#defaultCheck1").prop("checked", u.status === "Active");

  new bootstrap.Modal(staticBackdrop).show();
}


function validate() {

  if (
    !firstName.value.trim() ||
    !lastName.value.trim() ||
    !loginId.value.trim() ||
    !email.value.trim() ||
    !password.value.trim() ||
    !confirm_pwd.value.trim()
    //!mobile.value.trim() 
  ) {
    showToast("Please fill all required fields", "bg-danger");
    return false;
  }

  if (password.value.length < 6) {
    showToast("Password must be at least 6 characters", "bg-warning");
    return false;
  }

  if (password.value !== confirm_pwd.value) {
    showToast("Passwords do not match", "bg-danger");
    return false;
  }

 //let mobilePattern = /^[0-9]{10}$/;
 //if (!mobilePattern.test(mobile.value)) {
 //  showToast("Enter valid 10-digit mobile number", "bg-danger");
 //  return false;
 //}
  let mobileValue = mobile.value.trim();
  if (mobileValue !== "" && !/^[0-9]{10}$/.test(mobileValue)) {
      showToast("Enter valid 10-digit mobile number", "bg-danger");
      return false;
  }

  return true;
}

$('#defaultCheck1').change(function () {
    statu = $(this).is(':checked') ? "Active" : "Unactive";
   
});

function setStatus() {
    statu = $('#defaultCheck1').is(':checked') ? "Active" : "Unactive";
}

async function saveUser(){
  if(!validate()) return;

  statu = $('#defaultCheck1').is(':checked') ? "Active" : "Unactive";

  const data = {
    first_name: firstName.value,
    last_name: lastName.value,
    log_id: loginId.value,
    email: email.value,
    dept_id: department.value,
    role_id: userRole.value,  
    user_type_id: userType.value,
    password: password.value,
    status: statu,
    contact_no: mobile.value,
    address: address.value
   
  };

  if(selectedId){
    await axios.put(`/users/update/${selectedId}`,data);
    
    showToast("User updated successfully");
    clearall();
    
  } else {
    await axios.post('/users/create',data)
    //showToast("User created successfully");
    //clearall();
     .then(response => {

        if (response.data.Error.Error === false) 
        {
            var data = response.data.data;
            showToast("User created successfully");
            clearall();
          }
          else {
            //showToast(response.data.Error.Error_message);
             showToast("Failed to create user", "bg-danger");
          }

    })
   // .catch(error => {
   //     showToast("Failed to load departments");
   // });
    
  }
  loadUsers();
  bootstrap.Modal.getInstance(staticBackdrop).hide();
  
}

async function deleteUser(id){
 
 if(!confirm("Are you sure you want to delete this user?")){
    return;
  }
  await axios.delete(`/users/delete/${id}`);
  
  loadUsers();
  showToast("User deleted successfully");
  
}

function showToast(msg,cls="bg-success"){
  let toastEl=document.getElementById('toastMsg');
  toastEl.querySelector('.toast-body').innerText=msg;
  toastEl.querySelector('.toast-body').className="toast-body text-white "+cls;
  new bootstrap.Toast(toastEl).show();
}


function clearall()
{
  FillDepartment();
  loadUsers();
  Filluser_types();
  Filluser_role();
   firstName.value="";
   lastName.value="";
   loginId.value="";
   email.value="";
   password.value="";
   confirm_pwd.value="";
   
   mobile.value="";
   address.value="";
}

</script>

{% endblock %}
