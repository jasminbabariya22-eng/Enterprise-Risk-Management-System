    <script>
document.addEventListener("DOMContentLoaded", function () {

    const selectAll = document.getElementById("selectAll");

    // MASTER CLICK
    selectAll.addEventListener("click", function () {
        const checkboxes = document.querySelectorAll(".childCheckbox");

        checkboxes.forEach(function (checkbox) {
            checkbox.checked = selectAll.checked;
        });
    });

    // CHILD CLICK
    document.addEventListener("click", function (e) {
        if (e.target.classList.contains("childCheckbox")) {

            const checkboxes = document.querySelectorAll(".childCheckbox");
            const checked = document.querySelectorAll(".childCheckbox:checked");

            selectAll.checked = checkboxes.length === checked.length;
        }
    });

});
	</script>

    <script>

async function loadmenulist() {
  try {
    //alert("loadmenulist");
    const response = await axios.get('/FillMenuList');
    console.log("response FillMenuList", response);

    if (response.data.Error.Error === false) {
      var data = response.data.data;

      $('#MenuList').DataTable({
        destroy: true,
        data: data,
        paging: false,
        autoWidth: false, 
        columns: [
          
          {
            data: "menu_id",
            width:"50px",
            render: function (data) {
              return `
               <input type="checkbox" class="row-checkbox" value="${data}" />
              `;
            }
          },
          { data: "menu_name" }
        ]
      });


    } else {
      showToast(response.data.Error.Error_message);
    }

  } catch (error) {
    showToast("Failed to load MenuList");
  }
}



$(document).ready(function(){
 
 loadmenulist();
  loadrole();
});

function validate(){
  if(!roleName.value){
    showToast("Fill required fields","bg-danger");
    return false;
  }
  return true;
}

function getSelectedMenuIds() {
  let ids = [];

  document.querySelectorAll("#MenuList .row-checkbox:checked").forEach((cb) => {
    ids.push(parseInt(cb.value)); 
  });

  return ids;
}

async function saveusersrole(){
  if(!validate()) return;
  

  const data = {
    name:roleName.value,
    description:roleDescription.value,
    menuids:getSelectedMenuIds(),
  };
  console.log("Data pass Object:", data);

  if(selectedId){
    await axios.put(`/usersrole/update/${selectedId}`,data);
    
    showToast("User Role updated successfully");
    clearall();
    
  } else {
    await axios.post('/usersrole/create',data)
    //showToast("User Role created successfully");
    //clearall();
    .then(response => {
        if (response.data.Error.Error === false) 
        {
            var data = response.data.data;
            showToast("User Role created successfully");
            clearall();
          }
          else {
            //showToast(response.data.Error.Error_message);
             showToast("Failed to create user role", "bg-danger");
          }
    })
  }
  loadrole()
  bootstrap.Modal.getInstance(staticBackdrop).hide();
  
}

async function editusersrole(id){
 
  const res = await axios.get(`/usersrole/${id}`);
  const u = res.data.data;
  console.log("Data Get  editusersrole:", u);

  selectedId = u.id;
  roleName.value=u.name;
  roleDescription.value=u.description;
  setSelectedMenus(u.menuids);
  

  new bootstrap.Modal(staticBackdrop).show();
}

function setSelectedMenus(menuIds) {
  document.querySelectorAll("#MenuList .row-checkbox").forEach((cb) => {
    const value = parseInt(cb.value);
    if (menuIds.includes(value)) {
      cb.checked = true;
    } else {
      cb.checked = false;
    }

  });
}


function showToast(msg,cls="bg-success"){
  let toastEl=document.getElementById('toastMsg');
  toastEl.querySelector('.toast-body').innerText=msg;
  toastEl.querySelector('.toast-body').className="toast-body text-white "+cls;
  new bootstrap.Toast(toastEl).show();
}

async function deleteusersrole(id){
  if(!confirm("Are you sure you want to delete this user role?")){
    return;
  }
  await axios.delete(`/usersrole/delete/${id}`);
  
   loadrole();
  showToast("User Role deleted successfully");
 
}

function clearall(){
   roleName.value="";
   roleDescription.value="";
    document.querySelectorAll("#MenuList .row-checkbox").forEach(cb => {
        cb.checked = false;
    });
    selectedId = null;
}
